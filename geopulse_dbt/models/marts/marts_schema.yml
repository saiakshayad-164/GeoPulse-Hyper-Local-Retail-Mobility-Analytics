version: 2

models:
  - name: fct_store_footfall
    description: "Hourly unique visitor count and ping density within a 500m catchment radius of each store"
    columns:
      - name: store_id
        description: "Store identifier"
        tests:
          - not_null
      - name: hour
        description: "Hourly timestamp bucket"
        tests:
          - not_null
      - name: unique_visitors
        description: "Distinct devices detected within the store catchment"
        tests:
          - not_null

  - name: fct_cannibalization_metrics
    description: "Visitor overlap summary across existing and proposed stores"
    columns:
      - name: store_id
        description: "Store identifier"
        tests:
          - unique
          - not_null
      - name: store_type
        description: "Store status category"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Existing', 'Proposed']
      - name: overlapping_visitors
        description: "Count of distinct visitors detected within store catchment"
        tests:
          - not_null