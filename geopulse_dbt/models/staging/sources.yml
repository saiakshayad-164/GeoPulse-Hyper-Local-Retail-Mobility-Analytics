version: 2

sources:
  - name: geopulse_raw
    description: "Raw GPS pings and store master data from Member 1, plus spatial join output from Member 2"
    database: GEOPULSE_DB
    schema: PUBLIC
    tables:
      - name: GPS_PINGS
        description: "Verified anonymized mobile GPS ping events from Member 1"
        columns:
          - name: DEVICEID
          - name: LATITUDE
          - name: LONGITUDE
          - name: EVENT_TIMESTAMP
          - name: LOCATION

      - name: STORE_MASTER
        description: "Verified store master table from Member 1"
        columns:
          - name: STORE_ID
          - name: STORE_NAME
          - name: LATITUDE
          - name: LONGITUDE
          - name: AREA
          - name: STORE_TYPE
          - name: LOCATION

      - name: spatial_join_output
        description: "500m catchment spatial join output produced by Member 2 (PySpark + Apache Sedona)"
        columns:
          - name: device_id
          - name: store_id
          - name: timestamp
          - name: inside_catchment
          - name: distance_meters